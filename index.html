<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIG COUNTDOWN · OGA</title>
    <style>
        /* ===== RESET + GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            font-family: 'Courier New', monospace;
            color: #ffd700;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* ===== YELLOW STRIPS ===== */
        .top-strip, .bottom-strip {
            width: 100%;
            height: 60px;
            background-color: #ffd700;
            flex-shrink: 0;
        }

        .top-strip {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        /* ===== MAIN CONTAINER ===== */
        .countdown-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            max-width: 1200px;
            width: 100%;
        }

        /* ===== BIG COUNTDOWN ===== */
        .countdown-title {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .countdown-display {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px 50px;
            margin: 30px 0;
        }

        .countdown-item {
            background: rgba(255, 215, 0, 0.05);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 20px 30px;
            min-width: 130px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
        }

        .countdown-number {
            font-size: 5rem;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
            line-height: 1.2;
        }

        .countdown-label {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-top: 6px;
        }

        .countdown-message {
            font-size: 1.8rem;
            margin-top: 30px;
            opacity: 0.9;
            text-shadow: 0 0 10px #ffd700;
        }

        /* ===== MUSIC PLAYER ===== */
        .music-player {
            margin-top: 40px;
            background: rgba(255, 215, 0, 0.05);
            border: 2px solid #ffd700;
            border-radius: 60px;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }

        .music-player label {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .music-player input {
            background: black;
            border: 2px solid #ffd700;
            border-radius: 40px;
            padding: 12px 20px;
            color: #ffd700;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            width: 300px;
            max-width: 70vw;
            outline: none;
        }

        .music-player input::placeholder {
            color: #b8960f;
            opacity: 0.6;
        }

        .music-player input:focus {
            box-shadow: 0 0 20px #ffd700;
        }

        .music-player button {
            background: #ffd700;
            color: black;
            border: none;
            border-radius: 40px;
            padding: 12px 28px;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .music-player button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px #ffd700;
            background: #ffe44d;
        }

        .music-player .audio-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .music-player .audio-controls audio {
            max-width: 250px;
            background: black;
            border-radius: 40px;
            filter: invert(1) hue-rotate(180deg);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .countdown-title { font-size: 2.2rem; }
            .countdown-number { font-size: 3.5rem; }
            .countdown-item { padding: 15px 20px; min-width: 100px; }
            .music-player { flex-direction: column; padding: 20px; border-radius: 30px; }
            .music-player input { width: 100%; }
            .music-player .audio-controls audio { max-width: 100%; }
        }

        @media (max-width: 450px) {
            .countdown-title { font-size: 1.8rem; }
            .countdown-number { font-size: 2.8rem; }
            .countdown-item { padding: 12px 15px; min-width: 80px; }
        }
    </style>
</head>
<body>

    <!-- TOP STRIP -->
    <div class="top-strip">
        <span style="color: black; font-weight: bold; font-size: 1.6rem; letter-spacing: 8px;">⏳ OGA · COUNTDOWN</span>
    </div>

    <!-- MAIN COUNTDOWN -->
    <div class="countdown-wrapper">
        <h1 class="countdown-title">⚡ 1 YEAR · EXACT ⚡</h1>

        <div class="countdown-display" id="countdownDisplay">
            <div class="countdown-item">
                <div class="countdown-number" id="days">00</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="hours">00</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="minutes">00</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="seconds">00</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>

        <p class="countdown-message" id="countdownMessage">⏰ counting down to the big moment</p>

        <!-- MUSIC PLAYER (YOU CAN CHANGE THE SONG) -->
        <div class="music-player">
            <label for="songUrl">🎵 SONG</label>
            <input type="text" id="songUrl" placeholder="Paste your MP3 / audio URL here..." value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
            <div class="audio-controls">
                <button id="playBtn">▶ PLAY</button>
                <button id="pauseBtn">⏸ PAUSE</button>
                <audio id="audioPlayer" controls style="display: none;"></audio>
                <!-- we show custom controls, but keep audio element hidden -->
            </div>
        </div>
        <p style="margin-top: 10px; font-size: 0.9rem; opacity: 0.5;">(replace URL with your own song, then press PLAY)</p>
    </div>

    <!-- BOTTOM STRIP -->
    <div class="bottom-strip"></div>

    <script>
        (function() {
            // ========== 1 YEAR EXACT COUNTDOWN ==========
            // Target: 1 year from NOW (but we set it to a fixed date to avoid reset)
            // We want it to be exactly 1 year from the moment the page loads,
            // but we store it so it doesn't reset on refresh (optional).
            // However the user said: "ma ei taha et counter reetinks for some reason"
            // So we store the target in localStorage so it stays constant even after refresh.
            // If no stored target, set to 1 year from now.
            const STORAGE_KEY = 'oga_countdown_target';
            let targetDate;

            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                targetDate = new Date(stored);
                // if stored date is invalid or in the past, reset
                if (isNaN(targetDate.getTime()) || targetDate.getTime() < Date.now()) {
                    targetDate = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000);
                    localStorage.setItem(STORAGE_KEY, targetDate.toISOString());
                }
            } else {
                targetDate = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000); // 1 year
                localStorage.setItem(STORAGE_KEY, targetDate.toISOString());
            }

            // DOM elements
            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const messageEl = document.getElementById('countdownMessage');

            function updateCountdown() {
                const now = Date.now();
                const diff = targetDate.getTime() - now;

                if (diff <= 0) {
                    daysEl.textContent = '00';
                    hoursEl.textContent = '00';
                    minutesEl.textContent = '00';
                    secondsEl.textContent = '00';
                    messageEl.textContent = '🎉 THE DAY HAS COME! 🎉';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                daysEl.textContent = String(days).padStart(2, '0');
                hoursEl.textContent = String(hours).padStart(2, '0');
                minutesEl.textContent = String(minutes).padStart(2, '0');
                secondsEl.textContent = String(seconds).padStart(2, '0');

                // optional message
                if (days > 0) {
                    messageEl.textContent = `⏳ ${days} days · ${hours}h ${minutes}m ${seconds}s remaining`;
                } else if (hours > 0) {
                    messageEl.textContent = `⏳ ${hours}h ${minutes}m ${seconds}s remaining`;
                } else if (minutes > 0) {
                    messageEl.textContent = `⏳ ${minutes}m ${seconds}s remaining`;
                } else {
                    messageEl.textContent = `⏳ ${seconds}s remaining`;
                }
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);

            // ========== MUSIC PLAYER (CUSTOM) ==========
            const audio = document.getElementById('audioPlayer');
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const songUrlInput = document.getElementById('songUrl');

            // Load the song URL when play is clicked
            function loadAndPlay() {
                const url = songUrlInput.value.trim();
                if (!url) {
                    alert('Please paste a valid audio URL (MP3, WAV, etc.)');
                    return;
                }
                audio.src = url;
                audio.load();
                audio.play().catch(err => {
                    alert('Could not play the audio. Make sure the URL is valid and CORS-friendly.');
                    console.warn('Audio error:', err);
                });
            }

            playBtn.addEventListener('click', loadAndPlay);

            pauseBtn.addEventListener('click', function() {
                audio.pause();
            });

            // also allow Enter key on input
            songUrlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    loadAndPlay();
                }
            });

            // if user changes the URL, we don't auto-play, they have to press PLAY.
            // show audio element if needed? we keep it hidden, but we use our own controls.
            // we can also show it if user wants native controls: we set display: none, but we can make it visible.
            // for now, we keep it hidden and use custom buttons.

            // ===== EXTRA: if the audio ends, we could loop? let's not loop, but we can set loop if wanted.
            // audio.loop = true; // uncomment if you want loop

            console.log('✅ Countdown locked to:', targetDate.toISOString());
            console.log('🎵 Music player ready — paste your song URL and press PLAY');
        })();
    </script>

</body>
</html>
